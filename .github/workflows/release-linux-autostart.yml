name: Release Linux autostart update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-linux-autostart.yml

permissions:
  contents: write

concurrency:
  group: release-linux-autostart-v1.3.9
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare updated bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p previous bundle
          gh release download v1.3.8 \
            --pattern Tryvoha.zip \
            --dir previous
          unzip -q previous/Tryvoha.zip -d bundle

          mapfile -d '' linux_dirs < <(
            find bundle -mindepth 1 -maxdepth 3 \
              -type d -iname linux -print0
          )

          if [ "${#linux_dirs[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux directory in the verified bundle."
            exit 1
          fi

          linux_dir="${linux_dirs[0]}"
          find "$linux_dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          install -m 0755 linux/install.sh "$linux_dir/install.sh"
          install -m 0755 linux/uninstall.sh "$linux_dir/uninstall.sh"
          install -m 0755 linux/tryvoha.py "$linux_dir/tryvoha.py"
          install -m 0644 linux/README-LINUX.md "$linux_dir/README-LINUX.md"
          install -m 0644 linux/districts.json "$linux_dir/districts.json"
          install -m 0644 linux/tryvoha-normal.svg "$linux_dir/tryvoha-normal.svg"
          install -m 0644 linux/tryvoha-alert.svg "$linux_dir/tryvoha-alert.svg"

          (
            cd bundle
            zip -q -r ../Tryvoha.zip .
          )

      - name: Publish v1.3.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v1.3.9 >/dev/null 2>&1; then
            echo "Release v1.3.9 already exists."
            exit 0
          fi

          gh release create v1.3.9 Tryvoha.zip \
            --target "${GITHUB_SHA}" \
            --title "Тривога v1.3.9" \
            --notes "Linux-інсталятор автоматично вмикає запуск після входу до графічної сесії та одразу запускає застосунок. Додано безпечне видалення. Перевірений Windows-бінарник перенесено з v1.3.8 без перескладання."
