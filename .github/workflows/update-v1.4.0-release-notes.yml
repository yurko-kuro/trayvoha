name: Update v1.4.0 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v1.4.0-release-notes.yml

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Додано системні пакети «Тривога Desktop» для Ubuntu/Debian і Fedora.

          Завантаження розділено за платформами:
          - `Tryvoha-Desktop-Windows.zip` — переносна версія для Windows;
          - `Tryvoha-Desktop-Linux.zip` — переносна версія для Linux;
          - `.deb` — встановлення в Ubuntu/Debian;
          - `.rpm` — встановлення у Fedora.

          Linux-клієнт захищено від повторного запуску; системний автозапуск можна вимкнути у меню застосунку. Windows-бінарник перенесено з v1.3.9 без перескладання.
          EOF

          gh release edit v1.4.0 --repo "${{ github.repository }}" --notes-file release-notes.md
