name: TrayVoha — підготувати перший реліз 1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    name: Узгодити версію 1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Узгодити версію та документацію
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('1.5.0', '1.0.0')
              if path.as_posix() == 'macos/build-app.sh':
                  updated = updated.replace('<string>150</string>', '<string>100</string>')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          old_notes = Path('docs/RELEASE_NOTES_1.5.0.md')
          new_notes = Path('docs/RELEASE_NOTES_1.0.0.md')
          if old_notes.exists():
              old_notes.rename(new_notes)

          for temporary in (
              Path('.github/workflows/publish-1.5.0.yml'),
              Path('.github/workflows/cleanup-wrong-1.5.0.yml'),
              Path('.github/workflows/normalize-1.0.0.yml'),
          ):
              temporary.unlink(missing_ok=True)
          PY

          if git grep -n -F '1.5.0' -- ':!.git/**'; then
            echo 'ПОМИЛКА: залишилися посилання на 1.5.0.' >&2
            exit 1
          fi

          grep -F '<Version>1.0.0</Version>' TrayVoha.csproj >/dev/null
          grep -F '#define MyAppVersion "1.0.0"' packaging/windows/TrayVoha.iss >/dev/null
          grep -E '^Version:[[:space:]]+1\.0\.0$' packaging/rpm/trayvoha.spec >/dev/null
          grep -F 'version="${1:-1.0.0}"' packaging/debian/build-deb.sh >/dev/null
          grep -F '<string>1.0.0</string>' macos/build-app.sh >/dev/null
          grep -F '<string>100</string>' macos/build-app.sh >/dev/null
          grep -F 'TrayVoha/1.0.0' linux/trayvoha_app.py >/dev/null
          test -s docs/RELEASE_NOTES_1.0.0.md
          test ! -e docs/RELEASE_NOTES_1.5.0.md

      - name: Зафіксувати перший релізний номер
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Yurii Chornyi'
          git config user.email 'yurko.kuro@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: set first public version to 1.0.0'
          git push origin HEAD:main
