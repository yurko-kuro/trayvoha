name: TrayVoha CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate PowerShell audit syntax
        shell: pwsh
        run: |
          $scripts = @(
              '.\tools\windows-runtime-audit.ps1',
              '.\tools\windows-installer-audit.ps1'
          )
          foreach ($script in $scripts) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $script).Path,
                  [ref]$null,
                  [ref]$errors
              )
              if ($errors.Count -ne 0) {
                  $errors | Format-List | Out-String | Write-Host
                  throw "PowerShell audit містить синтаксичні помилки: $script"
              }
          }

      - name: Generate platform icons
        run: python tools/generate-icon-assets.py

      - name: Restore
        run: dotnet restore .\TrayVoha.csproj

      - name: Build with warnings as errors
        run: dotnet build .\TrayVoha.csproj --configuration Release --no-restore -warnaserror

      - name: Publish Windows artifact
        shell: pwsh
        run: |
          dotnet publish .\TrayVoha.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            --output .\dist-ci

          if (-not (Test-Path .\dist-ci\TrayVoha.exe)) {
              throw 'TrayVoha.exe не створено.'
          }

          $file = Get-Item .\dist-ci\TrayVoha.exe
          if ($file.Length -le 0) {
              throw 'TrayVoha.exe порожній.'
          }

          Write-Host "TrayVoha.exe: $($file.Length) bytes"
          (Get-FileHash .\dist-ci\TrayVoha.exe -Algorithm SHA256).Hash

      - name: Windows binary metadata and runtime network audit
        shell: pwsh
        run: .\tools\windows-runtime-audit.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isccCandidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
              choco install innosetup --no-progress -y
              $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
              throw 'Inno Setup compiler не знайдено.'
          }

          & $iscc .\packaging\windows\TrayVoha.iss
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup завершився з кодом $LASTEXITCODE"
          }

          $installer = '.\dist-installer\TrayVoha-Setup-x64.exe'
          if (-not (Test-Path $installer)) {
              throw 'TrayVoha-Setup-x64.exe не створено.'
          }
          if ((Get-Item $installer).Length -le 0) {
              throw 'TrayVoha-Setup-x64.exe порожній.'
          }

          Write-Host "Installer SHA256: $((Get-FileHash $installer -Algorithm SHA256).Hash)"

      - name: Windows installer install-uninstall audit
        shell: pwsh
        run: .\tools\windows-installer-audit.ps1

      - name: Upload audited Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrayVoha-Windows-ci
          path: |
            dist-ci/TrayVoha.exe
            dist-ci/runtime-audit.txt
            dist-ci/installer-audit.txt
            dist-installer/TrayVoha-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux and security invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: python -m py_compile linux/trayvoha.py linux/trayvoha_app.py tools/generate-icon-assets.py

      - name: Generate all icon assets
        run: python tools/generate-icon-assets.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n linux/install.sh
          bash -n linux/uninstall.sh
          bash -n packaging/debian/build-deb.sh
          bash -n packaging/rpm/build-rpm.sh

      - name: Product identity invariant
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern="$(printf '%s|%s|%s' 'Alert''Tray' 'Neptun''Tray' 'Try''voha')"
          matches="$(git grep -n -E "$legacy_pattern" -- ':!.git/**' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'ПОМИЛКА: знайдено legacy product identifier.' >&2
            exit 1
          fi

      - name: No browser or location access
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'webbrowser|Process\.Start|Geolocator|Geolocation|GPS|latitude|longitude|ipgeolocation|ip-api|ipinfo' -- '*.cs' 'linux/*.py'; then
            echo 'ПОМИЛКА: знайдено заборонений browser/location механізм.' >&2
            exit 1
          fi

      - name: Fixed runtime endpoint
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://neptun.in.ua/api/v1/alerts' NeptunAlertsClient.cs >/dev/null
          grep -F 'https://neptun.in.ua/api/v1/alerts' linux/trayvoha_app.py >/dev/null

          if grep -E 'https?://' NeptunAlertsClient.cs linux/trayvoha.py linux/trayvoha_app.py | grep -v -F 'https://neptun.in.ua/api/v1/alerts'; then
            echo 'ПОМИЛКА: runtime source містить додатковий зовнішній URL.' >&2
            exit 1
          fi

      - name: No runtime redirects
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AllowAutoRedirect = false' NeptunAlertsClient.cs >/dev/null
          grep -F 'class NoRedirectHandler' linux/trayvoha.py >/dev/null
          grep -F 'urllib.request.install_opener' linux/trayvoha.py >/dev/null
          grep -F 'urllib.request.build_opener(NoRedirectHandler())' linux/trayvoha.py >/dev/null
          grep -F 'from trayvoha_app import main' linux/trayvoha.py >/dev/null

      - name: Bounded NEPTUN response invariant
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'private const int MaxResponseBytes = 1_048_576;' NeptunAlertsClient.cs >/dev/null
          grep -F 'HttpCompletionOption.ResponseHeadersRead' NeptunAlertsClient.cs >/dev/null
          grep -F 'MaxResponseBytes + 1' NeptunAlertsClient.cs >/dev/null
          grep -F 'MAX_RESPONSE_BYTES = 1_048_576' linux/trayvoha_app.py >/dev/null
          grep -F 'response.read(MAX_RESPONSE_BYTES + 1)' linux/trayvoha_app.py >/dev/null

          if grep -F 'GetFromJsonAsync' NeptunAlertsClient.cs; then
            echo 'ПОМИЛКА: Windows runtime знову читає JSON без явної межі.' >&2
            exit 1
          fi
          if grep -F 'json.load(response)' linux/trayvoha_app.py; then
            echo 'ПОМИЛКА: Linux runtime знову читає JSON без явної межі.' >&2
            exit 1
          fi

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/debian/build-deb.sh 1.0.0 "$PWD/dist-ci"
          test -s "$PWD/dist-ci/trayvoha_1.0.0_all.deb"
          dpkg-deb --info "$PWD/dist-ci/trayvoha_1.0.0_all.deb" >/dev/null
          dpkg-deb --contents "$PWD/dist-ci/trayvoha_1.0.0_all.deb" | grep -F './usr/lib/trayvoha/trayvoha_app.py' >/dev/null
