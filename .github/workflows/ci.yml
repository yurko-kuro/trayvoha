name: TrayVoha CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate platform icons
        run: python tools/generate-icon-assets.py

      - name: Restore
        run: dotnet restore .\TrayVoha.csproj

      - name: Build with warnings as errors
        run: dotnet build .\TrayVoha.csproj --configuration Release --no-restore -warnaserror

      - name: Publish Windows artifact
        shell: pwsh
        run: |
          dotnet publish .\TrayVoha.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            --output .\dist-ci

          if (-not (Test-Path .\dist-ci\TrayVoha.exe)) {
              throw 'TrayVoha.exe не створено.'
          }

          $file = Get-Item .\dist-ci\TrayVoha.exe
          if ($file.Length -le 0) {
              throw 'TrayVoha.exe порожній.'
          }

          Write-Host "TrayVoha.exe: $($file.Length) bytes"
          (Get-FileHash .\dist-ci\TrayVoha.exe -Algorithm SHA256).Hash

      - name: Windows binary metadata and runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\dist-ci\TrayVoha.exe).Path
          $report = Join-Path $PWD 'dist-ci\runtime-audit.txt'

          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature $exe

          @(
            "SHA256=$hash"
            "FileVersion=$($version.FileVersion)"
            "ProductVersion=$($version.ProductVersion)"
            "ProductName=$($version.ProductName)"
            "OriginalFilename=$($version.OriginalFilename)"
            "SignatureStatus=$($signature.Status)"
            "Signer=$($signature.SignerCertificate.Subject)"
          ) | Set-Content -Encoding utf8 $report

          if ($version.ProductName -ne 'TrayVoha') {
              throw "Unexpected ProductName: $($version.ProductName)"
          }
          if (-not $version.ProductVersion.StartsWith('1.5.0')) {
              throw "Unexpected ProductVersion: $($version.ProductVersion)"
          }

          $settingsDir = Join-Path $env:APPDATA 'TrayVoha'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          @'
          {
            "Version": 2,
            "SetupCompleted": true,
            "SelectedAreaKeys": []
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $settingsDir 'settings.json')

          $before = @(Get-Process | Select-Object -ExpandProperty Id)
          $p = Start-Process -FilePath $exe -PassThru
          try {
              Start-Sleep -Seconds 15
              $p.Refresh()
              if ($p.HasExited) {
                  throw "TrayVoha exited during smoke test with code $($p.ExitCode)"
              }

              "PID=$($p.Id)" | Add-Content -Encoding utf8 $report

              $children = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id })
              "ChildProcessCount=$($children.Count)" | Add-Content -Encoding utf8 $report
              $children | Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
                  Format-List | Out-String | Add-Content -Encoding utf8 $report
              if ($children.Count -ne 0) {
                  throw 'TrayVoha spawned child processes during smoke test.'
              }

              $tcp = @(Get-NetTCPConnection -OwningProcess $p.Id -ErrorAction SilentlyContinue)
              $udp = @(Get-NetUDPEndpoint -OwningProcess $p.Id -ErrorAction SilentlyContinue)
              $listeners = @($tcp | Where-Object State -eq 'Listen')

              "TcpCount=$($tcp.Count)" | Add-Content -Encoding utf8 $report
              "UdpCount=$($udp.Count)" | Add-Content -Encoding utf8 $report
              "TcpListenCount=$($listeners.Count)" | Add-Content -Encoding utf8 $report

              '--- TCP ---' | Add-Content -Encoding utf8 $report
              $tcp | Select-Object State, LocalAddress, LocalPort, RemoteAddress, RemotePort |
                  Format-Table -AutoSize | Out-String | Add-Content -Encoding utf8 $report
              '--- UDP ---' | Add-Content -Encoding utf8 $report
              $udp | Select-Object LocalAddress, LocalPort |
                  Format-Table -AutoSize | Out-String | Add-Content -Encoding utf8 $report

              if ($listeners.Count -ne 0) {
                  throw 'TrayVoha opened an inbound TCP listener.'
              }
              if ($udp.Count -ne 0) {
                  throw 'TrayVoha opened a UDP endpoint.'
              }
          }
          finally {
              if (-not $p.HasExited) {
                  Stop-Process -Id $p.Id -Force
              }
          }

          Get-Content $report

      - name: Upload audited Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayVoha-Windows-ci
          path: |
            dist-ci/TrayVoha.exe
            dist-ci/runtime-audit.txt
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux and security invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: python -m py_compile linux/trayvoha.py tools/generate-icon-assets.py

      - name: Generate all icon assets
        run: python tools/generate-icon-assets.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n linux/install.sh
          bash -n linux/uninstall.sh
          bash -n packaging/debian/build-deb.sh
          bash -n packaging/rpm/build-rpm.sh

      - name: Product identity invariant
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -n -E 'AlertTray|NeptunTray|Tryvoha' -- ':!.github/**' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'ПОМИЛКА: знайдено legacy product identifier.' >&2
            exit 1
          fi

      - name: No browser or location access
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'webbrowser|Process\.Start|Geolocator|Geolocation|GPS|latitude|longitude|ipgeolocation|ip-api|ipinfo' -- '*.cs' 'linux/*.py'; then
            echo 'ПОМИЛКА: знайдено заборонений browser/location механізм.' >&2
            exit 1
          fi

      - name: Fixed runtime endpoint
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://neptun.in.ua/api/v1/alerts' NeptunAlertsClient.cs >/dev/null
          grep -F 'https://neptun.in.ua/api/v1/alerts' linux/trayvoha.py >/dev/null

          if grep -E 'https?://' NeptunAlertsClient.cs linux/trayvoha.py | grep -v -F 'https://neptun.in.ua/api/v1/alerts'; then
            echo 'ПОМИЛКА: runtime source містить додатковий зовнішній URL.' >&2
            exit 1
          fi

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/debian/build-deb.sh 1.5.0 "$PWD/dist-ci"
          test -s "$PWD/dist-ci/trayvoha_1.5.0_all.deb"
          dpkg-deb --info "$PWD/dist-ci/trayvoha_1.5.0_all.deb" >/dev/null
