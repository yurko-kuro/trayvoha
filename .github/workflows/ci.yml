name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Tryvoha.csproj --configuration Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile linux/tryvoha.py
      - run: python3 -c "import json; json.load(open('linux/districts.json', encoding='utf-8'))"
      - run: bash -n linux/install.sh
