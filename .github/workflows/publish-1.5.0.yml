name: TrayVoha — публікація v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.5.0.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Зібрати та опублікувати pre-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.5.0'
    steps:
      - name: Запустити релізну збірку
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$VERSION"

      - name: Знайти релізний workflow run
        id: release_run
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$GITHUB_SHA"'") | .databaseId' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Дочекатися перевіреної релізної збірки
        shell: bash
        env:
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Опублікувати як pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=true

      - name: Перевірити публікацію
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url
