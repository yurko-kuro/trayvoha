name: TrayVoha — прибрати legacy releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-legacy-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Прибрати старі релізи й теги
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Видалити legacy releases і теги
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.3.8 v1.3.9 v1.4.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done

          for tag in v1.3.8 v1.3.9 v1.4.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "ПОМИЛКА: release $tag ще існує" >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "ПОМИЛКА: tag $tag ще існує" >&2
              exit 1
            fi
          done
