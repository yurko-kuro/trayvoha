name: TrayVoha — опублікувати v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.0.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Зібрати й опублікувати pre-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.0.0'
      RELEASE_REF: 'release-v1.0.0'
      RELEASE_SHA: '60d6cb22efc61253285975dc530cfb68034482f9'
    steps:
      - name: Запустити релізну збірку перевіреного checkpoint
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_REF" \
            -f version="$VERSION"

      - name: Знайти релізний workflow run
        id: release_run
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$RELEASE_SHA"'") | .databaseId' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Дочекатися перевіреної релізної збірки
        shell: bash
        env:
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Перевірити draft і комплект артефактів
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets)"
          test "$(jq -r '.isDraft' <<<"$json")" = 'true'
          names="$(jq -r '.assets[].name' <<<"$json" | sort)"
          expected="$(printf '%s\n' \
            SHA256SUMS.txt \
            TrayVoha-Linux.zip \
            TrayVoha-Setup-x64.exe \
            TrayVoha-Windows.zip \
            TrayVoha-macOS.dmg \
            TrayVoha-macOS.zip \
            trayvoha-1.0.0-1.noarch.rpm \
            trayvoha_1.0.0_all.deb | sort)"
          test "$names" = "$expected"

      - name: Опублікувати як pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=true

      - name: Перевірити публікацію
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url)"
          test "$(jq -r '.tagName' <<<"$json")" = 'v1.0.0'
          test "$(jq -r '.isDraft' <<<"$json")" = 'false'
          test "$(jq -r '.isPrerelease' <<<"$json")" = 'true'
          jq . <<<"$json"
