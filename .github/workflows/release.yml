name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            version="$(grep -oPm1 '(?<=<Version>)[^<]+' Tryvoha.csproj)"
            release_tag="v$version"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows

  linux:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile linux/tryvoha.py
      - run: bash -n linux/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux

  publish:
    needs: [prepare, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: bundle/Windows
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: bundle/Linux
      - name: Build archive
        run: |
          cp README.md bundle/README.md
          (cd bundle && zip -r "../Тривога.zip" Windows Linux README.md)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          "Тривога.zip"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Тривога $RELEASE_TAG"
          --notes "Актуальна перевірена збірка «Тривога» для Windows і Linux."
      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$RELEASE_TAG" ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
            fi
          done
