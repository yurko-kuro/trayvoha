name: TrayVoha — чернетка релізу

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версія релізу
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Перевірити релізну версію
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Звірити версію 1.0.0
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$VERSION" = '1.0.0'
          grep -F '<Version>1.0.0</Version>' TrayVoha.csproj >/dev/null
          grep -F '#define MyAppVersion "1.0.0"' packaging/windows/TrayVoha.iss >/dev/null
          grep -E '^Version:[[:space:]]+1\.0\.0$' packaging/rpm/trayvoha.spec >/dev/null
          grep -F '<string>1.0.0</string>' macos/build-app.sh >/dev/null
          grep -F '# TrayVoha 1.0.0' docs/RELEASE_NOTES_1.0.0.md >/dev/null

  windows:
    name: Зібрати й перевірити Windows
    needs: preflight
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
      - name: Підготувати .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Підготувати Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Згенерувати іконки
        run: python tools/generate-icon-assets.py
      - name: Зібрати Windows із warnings-as-errors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore .\TrayVoha.csproj
          dotnet build .\TrayVoha.csproj --configuration Release --no-restore -warnaserror
          dotnet publish .\TrayVoha.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output .\dist-ci
          if (-not (Test-Path .\dist-ci\TrayVoha.exe)) { throw 'TrayVoha.exe не створено.' }
      - name: Перевірити runtime-мережу Windows
        shell: pwsh
        run: .\tools\windows-runtime-audit.ps1
      - name: Зібрати Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw 'Inno Setup compiler не знайдено.' }
          & $iscc .\packaging\windows\TrayVoha.iss
      - name: Перевірити встановлення та видалення Windows
        shell: pwsh
        run: .\tools\windows-installer-audit.ps1
      - name: Підготувати Windows-артефакти
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist-release | Out-Null
          Compress-Archive -Path .\dist-ci\TrayVoha.exe -DestinationPath .\dist-release\TrayVoha-Windows.zip -Force
          Copy-Item .\dist-installer\TrayVoha-Setup-x64.exe .\dist-release\TrayVoha-Setup-x64.exe
      - name: Завантажити Windows release-артефакти
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-release/*
          if-no-files-found: error

  linux:
    name: Зібрати й перевірити Linux
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Встановити інструменти пакування
        run: sudo apt-get update && sudo apt-get install -y rpm zip
      - name: Зібрати Debian і RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/dist-release"
          ./packaging/debian/build-deb.sh 1.0.0 "$PWD/dist-release"
          ./packaging/rpm/build-rpm.sh "$PWD/dist-release"
          rpm_path="$(find "$PWD/dist-release" -type f -name 'trayvoha-1.0.0-1.noarch.rpm' -print -quit)"
          test -n "$rpm_path"
          cp "$rpm_path" "$PWD/dist-release/trayvoha-1.0.0-1.noarch.rpm"
      - name: Зібрати переносний Linux ZIP
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$PWD/dist-release"
          portable="$release_dir/TrayVoha-Linux"
          mkdir -p "$portable"
          install -m 0755 linux/trayvoha.py "$portable/trayvoha.py"
          install -m 0644 linux/trayvoha_app.py "$portable/trayvoha_app.py"
          install -m 0644 linux/districts.json "$portable/districts.json"
          install -m 0644 linux/trayvoha*.svg "$portable/"
          install -m 0755 linux/install.sh linux/uninstall.sh "$portable/"
          (cd "$release_dir" && zip -qr TrayVoha-Linux.zip TrayVoha-Linux)
          rm -rf "$portable"
          (cd "$release_dir" && sha256sum TrayVoha-Linux.zip trayvoha_1.0.0_all.deb trayvoha-1.0.0-1.noarch.rpm > SHA256SUMS-Linux.txt)
      - name: Завантажити Linux release-артефакти
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-release/*
          if-no-files-found: error

  macos:
    name: Зібрати й перевірити macOS
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Зібрати TrayVoha.app, ZIP і DMG
        run: ./macos/build-app.sh "$PWD/dist-release"
      - name: Завантажити macOS release-артефакти
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist-release/TrayVoha-macOS.zip
            dist-release/TrayVoha-macOS.dmg
          if-no-files-found: error

  draft:
    name: Створити чернетку GitHub Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Створити лише draft release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum TrayVoha-Windows.zip TrayVoha-Setup-x64.exe TrayVoha-Linux.zip trayvoha_1.0.0_all.deb trayvoha-1.0.0-1.noarch.rpm TrayVoha-macOS.zip TrayVoha-macOS.dmg > SHA256SUMS.txt
          gh release create "v${VERSION}" TrayVoha-Windows.zip TrayVoha-Setup-x64.exe TrayVoha-Linux.zip trayvoha_1.0.0_all.deb trayvoha-1.0.0-1.noarch.rpm TrayVoha-macOS.zip TrayVoha-macOS.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TrayVoha v${VERSION}" --notes-file ../docs/RELEASE_NOTES_1.0.0.md --draft
