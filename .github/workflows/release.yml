name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Tryvoha.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r Tryvoha-linux.zip linux README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Tryvoha-linux.zip

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/windows/Tryvoha.exe
          artifacts/linux/Tryvoha-linux.zip
          --repo "$GITHUB_REPOSITORY"
          --title "Тривога $GITHUB_REF_NAME"
          --generate-notes
