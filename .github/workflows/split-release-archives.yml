name: Split desktop release archives

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/split-release-archives.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate combined archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.0 --repo "${{ github.repository }}" --pattern Tryvoha.zip --dir incoming

          mkdir unpacked
          unzip -q incoming/Tryvoha.zip -d unpacked

          mapfile -t windows_exes < <(find unpacked -maxdepth 4 -type f -iname '*.exe')
          mapfile -t linux_apps < <(find unpacked -maxdepth 4 -type f -name 'tryvoha.py')

          test "${#windows_exes[@]}" -eq 1
          test "${#linux_apps[@]}" -eq 1

          windows_dir="$(dirname "${windows_exes[0]}")"
          linux_dir="$(dirname "${linux_apps[0]}")"

          test -f "$linux_dir/install.sh"
          test "$windows_dir" != "$linux_dir"

          (
            cd "$windows_dir"
            zip -qr "$GITHUB_WORKSPACE/Tryvoha-Desktop-Windows.zip" .
          )
          (
            cd "$linux_dir"
            zip -qr "$GITHUB_WORKSPACE/Tryvoha-Desktop-Linux.zip" .
          )

          unzip -tq Tryvoha-Desktop-Windows.zip
          unzip -tq Tryvoha-Desktop-Linux.zip
          unzip -Z1 Tryvoha-Desktop-Windows.zip | grep -Eiq '\.exe$'
          unzip -Z1 Tryvoha-Desktop-Linux.zip | grep -Eq '(^|/)tryvoha.py$'
          unzip -Z1 Tryvoha-Desktop-Linux.zip | grep -Eq '(^|/)install.sh$'

      - name: Upload separate archives and remove combined archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.4.0 --repo "${{ github.repository }}" --clobber Tryvoha-Desktop-Windows.zip Tryvoha-Desktop-Linux.zip

          assets="$(gh release view v1.4.0 --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          grep -qx 'Tryvoha-Desktop-Windows.zip' <<<"$assets"
          grep -qx 'Tryvoha-Desktop-Linux.zip' <<<"$assets"

          gh release delete-asset v1.4.0 Tryvoha.zip --repo "${{ github.repository }}" --yes

      - name: Preserve split archives for verification
        uses: actions/upload-artifact@v4
        with:
          name: split-desktop-archives
          path: |
            Tryvoha-Desktop-Windows.zip
            Tryvoha-Desktop-Linux.zip
          if-no-files-found: error
