name: Normalize TrayVoha namespace once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Windows namespace
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          old = "namespace NeptunTray;"
          new = "namespace TrayVoha;"
          changed = []

          for path in sorted(Path('.').glob('*.cs')):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit("Не знайдено C#-файлів із namespace NeptunTray")

          print("Оновлено:")
          for path in changed:
              print(f"  {path}")
          PY

          if git grep -n -F 'namespace NeptunTray;' -- '*.cs'; then
            echo 'ПОМИЛКА: залишився namespace NeptunTray' >&2
            exit 1
          fi

          rm .github/workflows/brand-normalize-once.yml

          git add -A
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'brand: normalize Windows namespace to TrayVoha'
          git push
